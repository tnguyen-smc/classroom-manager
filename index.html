<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Admin — OU &amp; Course Manager</title>

<!-- UnoCSS runtime (Tailwind-compatible utility engine, no build step) -->
<script src="https://cdn.jsdelivr.net/npm/@unocss/runtime/uno.global.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">

<style>
  html, body { font-family: 'Roboto', Arial, sans-serif; }
  .font-display { font-family: 'Google Sans', 'Roboto', Arial, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  .fade-in { animation: fadeIn .18s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-4px);} to {opacity:1; transform:translateY(0);} }
  .toast-in { animation: toastIn .25s cubic-bezier(.34,1.56,.64,1); }
  @keyframes toastIn { from { opacity:0; transform: translateX(24px);} to {opacity:1; transform:translateX(0);} }
  [v-cloak] { display:none; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Toast container -->
  <div id="toast-container" class="fixed top-4 right-4 z-[80] flex flex-col gap-2 w-[92vw] max-w-sm"></div>

  <!-- Modal -->
  <div id="modal-backdrop" class="hidden fixed inset-0 bg-slate-900/40 z-70 flex items-center justify-center p-4">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 fade-in"></div>
  </div>

  <!-- Login overlay removed: single-user dashboard, no auth gate -->

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[#1a73e8] flex items-center justify-center text-white shrink-0">
          <span class="w-5 h-5" id="icon-logo"></span>
        </div>
        <div>
          <h1 class="font-display text-lg font-medium text-slate-900 leading-tight">Classroom Admin</h1>
          <p class="text-xs text-slate-500 leading-tight">Workspace directory &amp; course management</p>
        </div>
      </div>
      <nav class="flex gap-1 bg-slate-100 rounded-full p-1 text-sm font-medium">
        <button data-tab="ou" class="tab-btn px-4 py-1.5 rounded-full transition"></button>
        <button data-tab="classroom" class="tab-btn px-4 py-1.5 rounded-full transition"></button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

    <!-- TAB 1: OU & Student Browser -->
    <section id="view-ou">
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4 sm:p-5 mb-4">
        <div class="flex flex-wrap items-end gap-4">
          <div class="flex-1 min-w-[220px]">
            <label class="block text-xs font-medium text-slate-500 mb-1">Organizational Unit</label>
            <div class="relative">
              <select id="ou-select" class="w-full appearance-none border border-slate-300 rounded-lg pl-3 pr-9 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-[#1a73e8] focus:border-transparent">
                <option value="">Loading organizational units…</option>
              </select>
              <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" id="ou-chevron"></div>
            </div>
          </div>
          <button id="btn-refresh-ous" title="Refresh OUs" class="h-9 w-9 flex items-center justify-center rounded-lg border border-slate-300 text-slate-500 hover:bg-slate-50 transition">
            <span class="w-4 h-4 block" id="icon-refresh-ous"></span>
          </button>
          <div class="flex-1 min-w-[220px]">
            <label class="block text-xs font-medium text-slate-500 mb-1">Search roster</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" id="icon-search"></span>
              <input id="user-search" type="text" placeholder="Filter by name or email…" disabled
                class="w-full border border-slate-300 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a73e8] focus:border-transparent disabled:bg-slate-50 disabled:text-slate-400">
            </div>
          </div>
        </div>

        <div id="selection-bar" class="hidden mt-4 flex flex-wrap items-center gap-3 bg-blue-50 border border-blue-100 rounded-lg px-3 py-2">
          <span class="text-sm text-blue-800 font-medium"><span id="selected-count">0</span> student(s) selected</span>
          <button id="btn-enroll-selected" class="ml-auto text-sm font-medium text-white bg-[#1a73e8] hover:bg-blue-700 transition rounded-lg px-3 py-1.5 flex items-center gap-1.5">
            <span class="w-3.5 h-3.5" id="icon-enroll-selected"></span> Enroll in course
          </button>
          <button id="btn-clear-selection" class="text-sm font-medium text-blue-700 hover:text-blue-900 px-2 py-1.5">Clear</button>
        </div>
      </div>

      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        <div class="relative">
          <div id="ou-loading" class="hidden absolute inset-0 bg-white/70 backdrop-blur-[1px] z-10 flex items-center justify-center">
            <div class="flex items-center gap-2 text-slate-500 text-sm">
              <span class="w-5 h-5 animate-spin" id="icon-spinner-users"></span> Loading roster…
            </div>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-left text-xs text-slate-500 uppercase tracking-wide border-b border-slate-200">
                  <th class="px-4 py-3 w-10"><input type="checkbox" id="select-all" class="rounded border-slate-300"></th>
                  <th class="px-4 py-3">Name</th>
                  <th class="px-4 py-3">Email</th>
                  <th class="px-4 py-3">Status</th>
                </tr>
              </thead>
              <tbody id="user-table-body">
                <tr><td colspan="4" class="px-4 py-10 text-center text-slate-400 text-sm">Select an organizational unit to load its roster.</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 2: Classroom & Member Inspector -->
    <section id="view-classroom" class="hidden">
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4 sm:p-5 mb-4">
        <div class="flex flex-wrap items-end gap-3">
          <div class="flex-1 min-w-[220px]">
            <label class="block text-xs font-medium text-slate-500 mb-1">Course ID</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" id="icon-search-course"></span>
              <input id="course-id-input" type="text" placeholder="e.g. 123456789012"
                class="w-full border border-slate-300 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a73e8] focus:border-transparent">
            </div>
          </div>
          <button id="btn-load-course" class="h-9 px-4 rounded-lg bg-[#1a73e8] text-white text-sm font-medium hover:bg-blue-700 transition">Load roster</button>
          <div class="ml-auto flex gap-2">
            <button id="btn-open-add-teacher" class="h-9 px-3 rounded-lg border border-slate-300 text-sm font-medium text-slate-700 hover:bg-slate-50 transition flex items-center gap-1.5" disabled>
              <span class="w-3.5 h-3.5" id="icon-add-teacher"></span> Assign teacher
            </button>
            <button id="btn-open-add-student" class="h-9 px-3 rounded-lg bg-[#1e8e3e] text-white text-sm font-medium hover:bg-green-700 transition flex items-center gap-1.5" disabled>
              <span class="w-3.5 h-3.5" id="icon-add-student"></span> Enroll student
            </button>
          </div>
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <!-- Teachers -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
          <div class="relative">
            <div id="teachers-loading" class="hidden absolute inset-0 bg-white/70 backdrop-blur-[1px] z-10 flex items-center justify-center">
              <span class="w-5 h-5 animate-spin text-slate-500" id="icon-spinner-teachers"></span>
            </div>
            <div class="px-4 py-3 border-b border-slate-100 flex items-center gap-2">
              <span class="w-4 h-4 text-[#1a73e8]" id="icon-teachers-header"></span>
              <h2 class="font-display font-medium text-slate-800">Teachers</h2>
              <span id="teachers-count" class="ml-auto text-xs font-medium bg-blue-50 text-blue-700 rounded-full px-2 py-0.5">0</span>
            </div>
            <ul id="teachers-list" class="divide-y divide-slate-100">
              <li class="px-4 py-10 text-center text-slate-400 text-sm">Load a course to see its teachers.</li>
            </ul>
          </div>
        </div>

        <!-- Students -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
          <div class="relative">
            <div id="students-loading" class="hidden absolute inset-0 bg-white/70 backdrop-blur-[1px] z-10 flex items-center justify-center">
              <span class="w-5 h-5 animate-spin text-slate-500" id="icon-spinner-students"></span>
            </div>
            <div class="px-4 py-3 border-b border-slate-100 flex items-center gap-2">
              <span class="w-4 h-4 text-[#1e8e3e]" id="icon-students-header"></span>
              <h2 class="font-display font-medium text-slate-800">Students</h2>
              <span id="students-count" class="ml-auto text-xs font-medium bg-green-50 text-green-700 rounded-full px-2 py-0.5">0</span>
            </div>
            <ul id="students-list" class="divide-y divide-slate-100">
              <li class="px-4 py-10 text-center text-slate-400 text-sm">Load a course to see its students.</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

  </main>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbwOVGz0K530rfKj_sPJOfbDKx9aNkgjIKUFjPq8RsVCYescqQaTjTi1GWbGLYFJJJdk/exec";

/* ============================================================
   ICONS — raw inline SVG, no external icon libraries
   ============================================================ */
const ICONS = {
  logo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5-10-5z"></path><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"></path></svg>`,
  search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`,
  user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path></svg>`,
  users: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"></path><circle cx="17" cy="8" r="2.8"></circle><path d="M15.3 14.2c2.7.6 4.7 2.7 4.7 5.8"></path></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>`,
  spinner: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="3" stroke-opacity="0.25"></circle><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path></svg>`,
  mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>`,
  building: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1"></rect><line x1="8" y1="7" x2="8" y2="7.01"></line><line x1="12" y1="7" x2="12" y2="7.01"></line><line x1="16" y1="7" x2="16" y2="7.01"></line><line x1="8" y1="11" x2="8" y2="11.01"></line><line x1="12" y1="11" x2="12" y2="11.01"></line><line x1="16" y1="11" x2="16" y2="11.01"></line><path d="M9 21v-3h6v3"></path></svg>`,
  chevronDown: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`,
  x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`,
  checkCircle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="8 12 11 15 16 9"></polyline></svg>`,
  alertCircle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16" x2="12" y2="16.01"></line></svg>`,
  refresh: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6"></path><path d="M20 20v-6h-6"></path><path d="M5 15a8 8 0 0 0 14 3l1-1"></path><path d="M19 9a8 8 0 0 0-14-3L4 7"></path></svg>`,
};
function icon(el, name, extraClass) {
  if (!el) return;
  el.innerHTML = ICONS[name] || '';
  const svg = el.querySelector('svg');
  if (svg) { svg.setAttribute('class', 'w-full h-full ' + (extraClass || '')); }
}

/* ============================================================
   STATE
   ============================================================ */
const state = {
  activeTab: 'ou',
  ous: [],
  selectedOU: '',
  users: [],
  filteredUsers: [],
  selectedUserIds: new Set(),
  searchQuery: '',
  loadingOUs: false,
  loadingUsers: false,
  courseId: '',
  teachers: [],
  students: [],
  loadingMembers: false,
};

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
}
function getUserName(u) {
  return u?.name?.fullName || u?.fullName || u?.name || u?.primaryEmail || 'Unknown';
}
function getUserEmail(u) {
  return u?.primaryEmail || u?.email || '';
}
function isUserActive(u) {
  if (typeof u?.suspended === 'boolean') return !u.suspended;
  if (typeof u?.active === 'boolean') return u.active;
  if (typeof u?.status === 'string') return u.status.toLowerCase() === 'active';
  return true;
}
function getMemberName(m) {
  return m?.profile?.name?.fullName || m?.name?.fullName || m?.fullName || m?.name || m?.profile?.emailAddress || m?.email || 'Unknown';
}
function getMemberEmail(m) {
  return m?.profile?.emailAddress || m?.email || m?.emailAddress || '';
}

/* ============================================================
   TOASTS
   ============================================================ */
function showToast(message, type = 'success') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  const isSuccess = type === 'success';
  el.className = `toast-in flex items-start gap-3 rounded-xl shadow-lg border px-4 py-3 text-sm ${isSuccess ? 'bg-white border-green-200' : 'bg-white border-red-200'}`;
  el.innerHTML = `
    <span class="w-5 h-5 shrink-0 mt-0.5 ${isSuccess ? 'text-green-600' : 'text-red-600'}">${ICONS[isSuccess ? 'checkCircle' : 'alertCircle']}</span>
    <span class="flex-1 text-slate-700 leading-snug">${escapeHtml(message)}</span>
    <button class="shrink-0 text-slate-400 hover:text-slate-600 w-4 h-4 mt-0.5">${ICONS.x}</button>
  `;
  el.querySelector('button').addEventListener('click', () => el.remove());
  container.appendChild(el);
  setTimeout(() => el.remove(), 5000);
}

/* ============================================================
   API LAYER
   Note: POST requests use Content-Type: text/plain;charset=utf-8. Apps
   Script's web app endpoint doesn't implement doOptions(), so a POST sent
   with 'application/json' triggers a CORS preflight (OPTIONS) that Apps
   Script can't answer, producing "TypeError: NetworkError when attempting
   to fetch resource". text/plain is a CORS "simple" content type, so the
   browser sends the POST directly with no preflight. The JSON payload is
   still sent as a JSON string in the body; Code.gs parses it manually via
   JSON.parse(e.postData.contents).
   ============================================================ */
async function apiGet(params) {
  const url = new URL(API_URL);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString(), { method: 'GET' });
  if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
  const data = await res.json();
  if (data && data.success === false) throw new Error(data.error || 'Request failed');
  return data;
}
async function apiPost(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Server responded with status ${res.status}`);
  const data = await res.json();
  if (data && data.success === false) throw new Error(data.error || 'Request failed');
  return data;
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function setActiveTab(tab) {
  state.activeTab = tab;
  document.getElementById('view-ou').classList.toggle('hidden', tab !== 'ou');
  document.getElementById('view-classroom').classList.toggle('hidden', tab !== 'classroom');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const active = btn.dataset.tab === tab;
    btn.classList.toggle('bg-white', active);
    btn.classList.toggle('shadow-sm', active);
    btn.classList.toggle('text-slate-900', active);
    btn.classList.toggle('text-slate-500', !active);
  });
}

/* ============================================================
   TAB 1: OU & STUDENT BROWSER
   ============================================================ */
async function fetchOUs() {
  state.loadingOUs = true;
  const select = document.getElementById('ou-select');
  select.innerHTML = `<option value="">Loading organizational units…</option>`;
  select.disabled = true;
  try {
    const data = await apiGet({ action: 'getOUs' });
    const ous = data.ous || data.organizationUnits || (Array.isArray(data) ? data : []) || [];
    state.ous = ous;
    if (!ous.length) {
      select.innerHTML = `<option value="">No organizational units found</option>`;
    } else {
      select.innerHTML = `<option value="">Select an organizational unit…</option>` +
        ous.map(ou => {
          const path = ou.orgUnitPath || ou.path || '';
          const name = ou.name || path;
          return `<option value="${escapeHtml(path)}">${escapeHtml(name)}</option>`;
        }).join('');
    }
    select.disabled = false;
  } catch (err) {
    select.innerHTML = `<option value="">Failed to load OUs</option>`;
    showToast(err.message || 'Failed to load organizational units', 'error');
  } finally {
    state.loadingOUs = false;
  }
}

async function fetchUsersByOU(orgUnitPath) {
  state.loadingUsers = true;
  document.getElementById('ou-loading').classList.remove('hidden');
  document.getElementById('user-search').disabled = true;
  try {
    const data = await apiGet({ action: 'getUsersByOU', orgUnitPath });
    const users = data.users || (Array.isArray(data) ? data : []) || [];
    state.users = users;
    state.selectedUserIds.clear();
    applyUserFilter();
    document.getElementById('user-search').disabled = false;
  } catch (err) {
    state.users = [];
    state.filteredUsers = [];
    renderUserTable();
    showToast(err.message || 'Failed to load roster for this OU', 'error');
  } finally {
    state.loadingUsers = false;
    document.getElementById('ou-loading').classList.add('hidden');
    updateSelectionBar();
  }
}

function applyUserFilter() {
  const q = state.searchQuery.trim().toLowerCase();
  state.filteredUsers = !q ? state.users.slice() : state.users.filter(u =>
    getUserName(u).toLowerCase().includes(q) || getUserEmail(u).toLowerCase().includes(q)
  );
  renderUserTable();
}

function renderUserTable() {
  const tbody = document.getElementById('user-table-body');
  if (!state.selectedOU) {
    tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-10 text-center text-slate-400 text-sm">Select an organizational unit to load its roster.</td></tr>`;
    return;
  }
  if (!state.loadingUsers && state.filteredUsers.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-10 text-center text-slate-400 text-sm">No students match this OU or search.</td></tr>`;
    return;
  }
  tbody.innerHTML = state.filteredUsers.map(u => {
    const email = getUserEmail(u);
    const name = getUserName(u);
    const active = isUserActive(u);
    const checked = state.selectedUserIds.has(email) ? 'checked' : '';
    return `
      <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50 transition">
        <td class="px-4 py-3"><input type="checkbox" data-email="${escapeHtml(email)}" class="row-checkbox rounded border-slate-300" ${checked}></td>
        <td class="px-4 py-3">
          <div class="flex items-center gap-2.5">
            <span class="w-7 h-7 rounded-full bg-blue-100 text-blue-700 text-xs font-medium flex items-center justify-center shrink-0">${escapeHtml(initials(name))}</span>
            <span class="font-medium text-slate-800">${escapeHtml(name)}</span>
          </div>
        </td>
        <td class="px-4 py-3 text-slate-500">${escapeHtml(email)}</td>
        <td class="px-4 py-3">
          <span class="text-xs font-medium rounded-full px-2 py-0.5 ${active ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'}">${active ? 'Active' : 'Suspended'}</span>
        </td>
      </tr>`;
  }).join('');

  document.querySelectorAll('.row-checkbox').forEach(cb => {
    cb.addEventListener('change', () => {
      const email = cb.dataset.email;
      if (cb.checked) state.selectedUserIds.add(email); else state.selectedUserIds.delete(email);
      updateSelectionBar();
      syncSelectAllState();
    });
  });
  syncSelectAllState();
}

function syncSelectAllState() {
  const selectAll = document.getElementById('select-all');
  const visibleEmails = state.filteredUsers.map(getUserEmail);
  const allChecked = visibleEmails.length > 0 && visibleEmails.every(e => state.selectedUserIds.has(e));
  selectAll.checked = allChecked;
}

function updateSelectionBar() {
  const bar = document.getElementById('selection-bar');
  const count = state.selectedUserIds.size;
  document.getElementById('selected-count').textContent = count;
  bar.classList.toggle('hidden', count === 0);
}

/* ============================================================
   TAB 2: CLASSROOM & MEMBER INSPECTOR
   ============================================================ */
async function fetchCourseMembers(courseId) {
  state.loadingMembers = true;
  document.getElementById('teachers-loading').classList.remove('hidden');
  document.getElementById('students-loading').classList.remove('hidden');
  document.getElementById('btn-open-add-teacher').disabled = true;
  document.getElementById('btn-open-add-student').disabled = true;
  try {
    const data = await apiGet({ action: 'getCourseMembers', courseId });
    state.teachers = data.teachers || [];
    state.students = data.students || [];
    renderMembers();
    document.getElementById('btn-open-add-teacher').disabled = false;
    document.getElementById('btn-open-add-student').disabled = false;
  } catch (err) {
    state.teachers = [];
    state.students = [];
    renderMembers();
    showToast(err.message || 'Failed to load course roster', 'error');
  } finally {
    state.loadingMembers = false;
    document.getElementById('teachers-loading').classList.add('hidden');
    document.getElementById('students-loading').classList.add('hidden');
  }
}

function renderMembers() {
  document.getElementById('teachers-count').textContent = state.teachers.length;
  document.getElementById('students-count').textContent = state.students.length;

  const teachersList = document.getElementById('teachers-list');
  teachersList.innerHTML = state.teachers.length ? state.teachers.map(t => memberRow(t, 'teacher')).join('')
    : `<li class="px-4 py-10 text-center text-slate-400 text-sm">${state.courseId ? 'No teachers found for this course.' : 'Load a course to see its teachers.'}</li>`;

  const studentsList = document.getElementById('students-list');
  studentsList.innerHTML = state.students.length ? state.students.map(s => memberRow(s, 'student')).join('')
    : `<li class="px-4 py-10 text-center text-slate-400 text-sm">${state.courseId ? 'No students found for this course.' : 'Load a course to see its students.'}</li>`;

  document.querySelectorAll('.remove-member-btn').forEach(btn => {
    btn.addEventListener('click', () => confirmRemoveMember(btn.dataset.email, btn.dataset.role));
  });
}

function memberRow(m, role) {
  const name = getMemberName(m);
  const email = getMemberEmail(m);
  const accent = role === 'teacher' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700';
  return `
    <li class="px-4 py-3 flex items-center gap-3">
      <span class="w-8 h-8 rounded-full ${accent} text-xs font-medium flex items-center justify-center shrink-0">${escapeHtml(initials(name))}</span>
      <div class="min-w-0 flex-1">
        <p class="text-sm font-medium text-slate-800 truncate">${escapeHtml(name)}</p>
        <p class="text-xs text-slate-500 truncate">${escapeHtml(email)}</p>
      </div>
      <button class="remove-member-btn shrink-0 w-8 h-8 flex items-center justify-center rounded-lg text-red-500 hover:bg-red-50 transition" data-email="${escapeHtml(email)}" data-role="${role}" title="Remove">
        <span class="w-4 h-4 block">${ICONS.trash}</span>
      </button>
    </li>`;
}

/* ============================================================
   MODALS
   ============================================================ */
function openModal(html) {
  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('modal-backdrop').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-backdrop').classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';
}
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if (e.target.id === 'modal-backdrop') closeModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function openAddTeacherModal() {
  openModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-display text-lg font-medium text-slate-900">Assign teacher</h3>
      <button id="modal-close" class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100">${ICONS.x}</button>
    </div>
    <p class="text-sm text-slate-500 mb-3">Add a co-teacher to course <span class="font-medium text-slate-700">${escapeHtml(state.courseId)}</span>.</p>
    <label class="block text-xs font-medium text-slate-500 mb-1">Teacher email</label>
    <div class="relative mb-4">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400">${ICONS.mail}</span>
      <input id="teacher-email-input" type="email" placeholder="teacher@school.edu"
        class="w-full border border-slate-300 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#1a73e8] focus:border-transparent">
    </div>
    <div class="flex justify-end gap-2">
      <button id="modal-cancel" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</button>
      <button id="modal-submit" class="px-4 py-2 text-sm font-medium text-white bg-[#1a73e8] hover:bg-blue-700 rounded-lg transition flex items-center gap-2">
        <span>Add teacher</span>
      </button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-submit').addEventListener('click', async () => {
    const input = document.getElementById('teacher-email-input');
    const email = input.value.trim();
    if (!email) { input.focus(); return; }
    const btn = document.getElementById('modal-submit');
    setButtonLoading(btn, 'Adding…');
    try {
      await apiPost({ action: 'addTeacher', courseId: state.courseId, teacherEmail: email });
      showToast(`${email} added as a teacher.`, 'success');
      closeModal();
      fetchCourseMembers(state.courseId);
    } catch (err) {
      showToast(err.message || 'Failed to add teacher', 'error');
      resetButtonLoading(btn, 'Add teacher');
    }
  });
}

function openAddStudentModal() {
  openModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-display text-lg font-medium text-slate-900">Enroll student</h3>
      <button id="modal-close" class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100">${ICONS.x}</button>
    </div>
    <p class="text-sm text-slate-500 mb-3">Enroll a student in course <span class="font-medium text-slate-700">${escapeHtml(state.courseId)}</span>.</p>
    <label class="block text-xs font-medium text-slate-500 mb-1">Student email</label>
    <div class="relative mb-4">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400">${ICONS.mail}</span>
      <input id="student-email-input" type="email" placeholder="student@school.edu"
        class="w-full border border-slate-300 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#1e8e3e] focus:border-transparent">
    </div>
    <div class="flex justify-end gap-2">
      <button id="modal-cancel" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</button>
      <button id="modal-submit" class="px-4 py-2 text-sm font-medium text-white bg-[#1e8e3e] hover:bg-green-700 rounded-lg transition">Enroll student</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-submit').addEventListener('click', async () => {
    const input = document.getElementById('student-email-input');
    const email = input.value.trim();
    if (!email) { input.focus(); return; }
    const btn = document.getElementById('modal-submit');
    setButtonLoading(btn, 'Enrolling…');
    try {
      await apiPost({ action: 'addStudent', courseId: state.courseId, studentEmail: email });
      showToast(`${email} enrolled as a student.`, 'success');
      closeModal();
      fetchCourseMembers(state.courseId);
    } catch (err) {
      showToast(err.message || 'Failed to enroll student', 'error');
      resetButtonLoading(btn, 'Enroll student');
    }
  });
}

function confirmRemoveMember(email, role) {
  const label = role === 'teacher' ? 'teacher' : 'student';
  openModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-display text-lg font-medium text-slate-900">Remove ${label}</h3>
      <button id="modal-close" class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100">${ICONS.x}</button>
    </div>
    <p class="text-sm text-slate-600 mb-6">Remove <span class="font-medium">${escapeHtml(email)}</span> from course <span class="font-medium">${escapeHtml(state.courseId)}</span>? This can't be undone from here.</p>
    <div class="flex justify-end gap-2">
      <button id="modal-cancel" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</button>
      <button id="modal-submit" class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition">Remove</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-submit').addEventListener('click', async () => {
    const btn = document.getElementById('modal-submit');
    setButtonLoading(btn, 'Removing…');
    try {
      const action = role === 'teacher' ? 'removeTeacher' : 'removeStudent';
      const payload = { action, courseId: state.courseId };
      if (role === 'teacher') payload.teacherEmail = email; else payload.studentEmail = email;
      await apiPost(payload);
      showToast(`${email} removed from the course.`, 'success');
      closeModal();
      fetchCourseMembers(state.courseId);
    } catch (err) {
      showToast(err.message || `Failed to remove ${label}`, 'error');
      resetButtonLoading(btn, 'Remove');
    }
  });
}

function openEnrollSelectedModal() {
  const emails = Array.from(state.selectedUserIds);
  openModal(`
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-display text-lg font-medium text-slate-900">Enroll selected students</h3>
      <button id="modal-close" class="w-7 h-7 flex items-center justify-center rounded-lg text-slate-400 hover:bg-slate-100">${ICONS.x}</button>
    </div>
    <p class="text-sm text-slate-500 mb-3">${emails.length} student(s) selected. Enter the destination course ID.</p>
    <label class="block text-xs font-medium text-slate-500 mb-1">Course ID</label>
    <input id="bulk-course-id-input" type="text" placeholder="e.g. 123456789012"
      class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-[#1e8e3e] focus:border-transparent">
    <div class="flex justify-end gap-2">
      <button id="modal-cancel" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition">Cancel</button>
      <button id="modal-submit" class="px-4 py-2 text-sm font-medium text-white bg-[#1e8e3e] hover:bg-green-700 rounded-lg transition">Enroll all</button>
    </div>
  `);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-submit').addEventListener('click', async () => {
    const courseId = document.getElementById('bulk-course-id-input').value.trim();
    if (!courseId) return;
    const btn = document.getElementById('modal-submit');
    setButtonLoading(btn, 'Enrolling…');
    let ok = 0, fail = 0;
    for (const email of emails) {
      try {
        await apiPost({ action: 'addStudent', courseId, studentEmail: email });
        ok++;
      } catch (err) {
        fail++;
      }
    }
    closeModal();
    if (fail === 0) showToast(`Enrolled ${ok} student(s) in course ${courseId}.`, 'success');
    else showToast(`Enrolled ${ok} student(s); ${fail} failed. Check emails and try again.`, 'error');
  });
}

function setButtonLoading(btn, label) {
  btn.disabled = true;
  btn.dataset.original = btn.innerHTML;
  btn.innerHTML = `<span class="w-4 h-4 animate-spin inline-block align-[-3px]">${ICONS.spinner}</span> ${label}`;
}
function resetButtonLoading(btn, label) {
  btn.disabled = false;
  btn.innerHTML = label;
}

/* ============================================================
   WIRE UP
   ============================================================ */
function init() {
  // header icons
  icon(document.getElementById('icon-logo'), 'logo');
  document.querySelectorAll('.tab-btn')[0].textContent = 'OU & Students';
  document.querySelectorAll('.tab-btn')[1].textContent = 'Classrooms';

  icon(document.getElementById('ou-chevron'), 'chevronDown');
  icon(document.getElementById('icon-refresh-ous'), 'refresh');
  icon(document.getElementById('icon-search'), 'search');
  icon(document.getElementById('icon-search-course'), 'search');
  icon(document.getElementById('icon-enroll-selected'), 'plus');
  icon(document.getElementById('icon-spinner-users'), 'spinner');
  icon(document.getElementById('icon-add-teacher'), 'plus');
  icon(document.getElementById('icon-add-student'), 'plus');
  icon(document.getElementById('icon-teachers-header'), 'user');
  icon(document.getElementById('icon-students-header'), 'users');
  icon(document.getElementById('icon-spinner-teachers'), 'spinner');
  icon(document.getElementById('icon-spinner-students'), 'spinner');

  setActiveTab('ou');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
  });

  // Tab 1 events
  document.getElementById('ou-select').addEventListener('change', (e) => {
    state.selectedOU = e.target.value;
    if (state.selectedOU) fetchUsersByOU(state.selectedOU);
    else { state.users = []; state.filteredUsers = []; renderUserTable(); document.getElementById('user-search').disabled = true; }
  });
  document.getElementById('btn-refresh-ous').addEventListener('click', fetchOUs);
  document.getElementById('user-search').addEventListener('input', (e) => {
    state.searchQuery = e.target.value;
    applyUserFilter();
  });
  document.getElementById('select-all').addEventListener('change', (e) => {
    const emails = state.filteredUsers.map(getUserEmail);
    if (e.target.checked) emails.forEach(em => state.selectedUserIds.add(em));
    else emails.forEach(em => state.selectedUserIds.delete(em));
    renderUserTable();
    updateSelectionBar();
  });
  document.getElementById('btn-clear-selection').addEventListener('click', () => {
    state.selectedUserIds.clear();
    renderUserTable();
    updateSelectionBar();
  });
  document.getElementById('btn-enroll-selected').addEventListener('click', openEnrollSelectedModal);

  // Tab 2 events
  document.getElementById('btn-load-course').addEventListener('click', () => {
    const id = document.getElementById('course-id-input').value.trim();
    if (!id) { showToast('Enter a course ID first.', 'error'); return; }
    state.courseId = id;
    fetchCourseMembers(id);
  });
  document.getElementById('course-id-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-load-course').click();
  });
  document.getElementById('btn-open-add-teacher').addEventListener('click', openAddTeacherModal);
  document.getElementById('btn-open-add-student').addEventListener('click', openAddStudentModal);

  fetchOUs();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
